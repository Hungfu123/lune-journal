# lune-journal.duckdns.org — läuft im Nginx-Container der Softball-App.
# Mount in /opt/softball/docker-compose.yml (Service nginx):
#   - /opt/lune-journal/repo/deploy/nginx-lune.conf:/etc/nginx/conf.d/lune.conf:ro
#
# Zertifikat: certbot standalone, wie bei den anderen beiden Domains.
# Nginx terminiert TLS und reicht an den Caddy-Container "lune-web" weiter.
# Caddy übernimmt dort /api, den Foto-Schutz (forward_auth) und die App.

server {
    listen 80;
    server_name lune-journal.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lune-journal.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/lune-journal.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lune-journal.duckdns.org/privkey.pem;

    # Fotos kommen direkt vom Handy, mehrere auf einmal
    client_max_body_size 128m;

    # Namen erst zur Laufzeit auflösen (Dockers eingebauter DNS). Ohne das
    # startet Nginx nicht, solange der Container "lune-web" fehlt — und
    # nähme damit die Softball-App mit runter.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lune http://lune-web:80;

    location / {
        proxy_pass $lune;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Das Buch-PDF kann bei vielen Fotos ein paar Minuten rendern
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
